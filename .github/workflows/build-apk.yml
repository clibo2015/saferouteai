name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL (e.g., https://your-service.onrender.com)"
        required: false
        default: ""

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure Backend URL & Build React Web Assets
        working-directory: frontend
        run: |
          if [ -n "${{ github.event.inputs.backend_url }}" ]; then
            echo "REACT_APP_API_URL=${{ github.event.inputs.backend_url }}" > .env.production
          elif [ -n "${{ secrets.REACT_APP_API_URL }}" ]; then
            echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" > .env.production
          fi
          npm run build
          npx cap sync android

      - name: Make Gradle Executable
        working-directory: frontend/android
        run: chmod +x ./gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saferouteai-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
