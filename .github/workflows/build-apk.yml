name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL (e.g., https://your-service.onrender.com)"
        required: false
        default: ""

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Configure Backend URL & Build React Web Assets
        working-directory: frontend
        env:
          CI: false
        run: |
          if [ -n "${{ github.event.inputs.backend_url }}" ]; then
            echo "REACT_APP_API_URL=${{ github.event.inputs.backend_url }}" >> .env.production
          elif [ -n "${{ secrets.REACT_APP_API_URL }}" ]; then
            echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" >> .env.production
          fi
          if [ -n "${{ secrets.REACT_APP_CARTO_API_KEY }}" ]; then
            echo "REACT_APP_CARTO_API_KEY=${{ secrets.REACT_APP_CARTO_API_KEY }}" >> .env.production
          fi
          npm run build
          npx cap sync android

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;34.0.0" || true

      - name: Make Gradle Executable
        working-directory: frontend/android
        run: chmod +x ./gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saferouteai-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
